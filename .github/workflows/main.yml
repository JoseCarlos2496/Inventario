name: Deploy .NET 10 to SmarterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: windows-latest

    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #- name: Setup .NET 10
      #  uses: actions/setup-dotnet@v4
      #  with:
      #    dotnet-version: '10.x'
      
      - name: Restore solution
        run: dotnet restore Inventario.slnx

      - name: Build solution
        run: >
          dotnet build Inventario.slnx
          --configuration Release
          --no-restore
      
      - name: Publish API
        run: >
          dotnet publish
          ./Api/Inventario.Api/Inventario.Api.csproj
          --configuration Release
          --no-restore
          --output ./publish

      - name: Deploy to SmarterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./publish/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard
          passive: true
